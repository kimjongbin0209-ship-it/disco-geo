[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "disco-geo"
version = "0.1.0"
description = "Task-driven visual representations with Disco103 and frozen 3D generative transfer"
requires-python = ">=3.11,<3.14"
dependencies = ["numpy>=1.26,<3", "pillow>=10"]

[project.optional-dependencies]
rl = ["jax==0.4.38", "dm-haiku==0.0.13", "chex==0.1.89", "optax==0.2.4", "distrax==0.1.5", "rlax==0.1.7", "ml-collections>=1,<2", "dm-env>=1.6", "scipy>=1.10", "immutabledict>=4"]
generative = ["torch>=2.4", "torchvision>=0.19", "safetensors>=0.4", "tqdm>=4", "huggingface-hub>=0.25"]
report = ["matplotlib>=3.9,<4"]
gqn = ["tensorflow>=2.16,<3"]
dev = ["pytest>=8", "ruff>=0.9"]

[project.scripts]
disco-geo = "disco_geo.cli:main"

[tool.setuptools.packages.find]
include = ["disco_geo*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
exclude = ["third_party"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
