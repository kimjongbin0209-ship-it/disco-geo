[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "disco-spatial"
version = "0.2.0"
description = "Limited-reward spatial abilities with recurrent Disco103 and controlled experience reuse"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy>=1.26,<3", "dm-env==1.6"]

[project.optional-dependencies]
rl = ["jax==0.4.38", "dm-haiku==0.0.13", "chex==0.1.89", "optax==0.2.4", "distrax==0.1.5", "rlax==0.1.7", "ml-collections>=1,<2", "scipy>=1.10", "immutabledict>=4"]
environment = ["memory-maze==1.0.3", "dm-control==1.0.50", "mujoco==3.17.0", "labmaze==1.0.6", "gym==0.26.2"]
dev = ["pytest>=8", "ruff>=0.9"]

[project.scripts]
disco-spatial = "disco_spatial.cli:main"

[tool.setuptools.packages.find]
include = ["disco_spatial*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
exclude = ["third_party"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
